name: zz-s7

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Init secrets natively
        env:
          TY_USERNAME_1: ${{ secrets.TY_USERNAME_1 }}
          TY_PASSWORD_1: ${{ secrets.TY_PASSWORD_1 }}
        run: |
          {
            printf 'TY_USERNAME_1=%s\n' "$TY_USERNAME_1"
            printf 'TY_PASSWORD_1=%s\n' "$TY_PASSWORD_1"
          } > .env
          echo "wrote .env with $(wc -l < .env) lines"
